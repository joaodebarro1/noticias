name: Robo de noticias

on:
  # O agendamento principal (a cada 30 min) vem de fora: cron-job.org chama a API do GitHub
  # (workflow_dispatch). O agendamento do próprio GitHub é irregular (chegou a rodar 4 vezes
  # em 14h), então fica só como reserva a cada 3h, caso o cron-job.org falhe ou a chave vença.
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:         # cron-job.org e o botão "Run workflow"
    inputs:
      teste:
        description: "Só mandar uma notícia de teste (Telegram/WhatsApp/OpenAI)"
        type: boolean
        default: false
      regua:
        description: "Só mandar a régua (mensagem longa numerada, para medir onde o WhatsApp corta)"
        type: boolean
        default: false

# nunca roda duas execuções ao mesmo tempo (evita alertas duplicados)
concurrency:
  group: robo-noticias
  cancel-in-progress: false

permissions:
  contents: write            # só para o commit de "manter ativo" (ver último passo)

jobs:
  rodar:
    runs-on: ubuntu-24.04    # versão fixa: o ubuntu-latest muda sozinho de tempos em tempos
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # traz o noticias.db da execução anterior (histórico de notícias já enviadas)
      - name: Restaurar histórico
        uses: actions/cache/restore@v6
        with:
          path: noticias.db
          key: noticias-db-${{ github.run_id }}
          restore-keys: noticias-db-

      - name: Rodar um ciclo (ou teste)
        run: python robo_noticias.py ${{ inputs.regua && '--regua' || inputs.teste && '--teste' || '--uma-vez' }}
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_FONE: ${{ secrets.WHATSAPP_FONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

      - name: Salvar histórico
        if: always() && !inputs.teste && !inputs.regua
        uses: actions/cache/save@v6
        with:
          path: noticias.db
          key: noticias-db-${{ github.run_id }}-${{ github.run_attempt }}

      # Em repositório público, o GitHub desliga o agendamento depois de 60 dias sem
      # nenhum commit. Se o último commit tiver mais de 45 dias, faz um commit vazio.
      - name: Manter o agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          idade=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$idade" -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter agendamento ativo"
            git push
          fi
